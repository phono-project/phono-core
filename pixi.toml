[workspace]
name = "phono-core-env"
description = "phono core compile environment"
channels = ["conda-forge"]
platforms = [
  "linux-64",
  "linux-aarch64",
  "win-64",
  "osx-arm64",
]

[dependencies]
python = "=3.13.15"
ninja = "*"
cmake = "*"
pip = "*"
just = "*"

huggingface_hub = "*"

c-compiler = "*"
cxx-compiler = "*"

pytorch = "<2.14" # torch 2.14 requires macos 14+
pyyaml = "=6.0.3"
flatbuffers = "=24.3.25" # third_party\executorch\third-party\flatbuffers\include\flatbuffers\base.h

[target.linux-64.activation.env]
CMAKE_BUILD_DIR = "linux-native"
[target.linux-aarch64.activation.env]
CMAKE_BUILD_DIR = "linux-native"
[target.osx-arm64.activation.env]
CMAKE_BUILD_DIR = "macos-native"
[target.win-64.activation.env]
CMAKE_BUILD_DIR = "windows-native"
[target.win-64.tasks]
config = "unset CMAKE_GENERATOR_PLATFORM && unset CMAKE_GENERATOR_TOOLSET && cmake --preset $CMAKE_BUILD_DIR" # for ninja

[tasks]
setup = """
  mkdir -p third_party/executorch
  just prepare-executorch
"""
prepare-models = "just prepare-models"
format = "black . && isort ."
lint = "flake8 . && mypy ."
config = "cmake --preset $CMAKE_BUILD_DIR"
build = "cmake --build --preset $CMAKE_BUILD_DIR"
install = "cmake --build --preset $CMAKE_BUILD_DIR --target install"
test = """
  export PHONO_TEST_MODEL_DIR=$(readlink -m cache/models/w4a8/)
  ctest --preset $CMAKE_BUILD_DIR
  export PHONO_TEST_MODEL_DIR=$(readlink -m cache/models/w8a8/)
  ctest --preset $CMAKE_BUILD_DIR
"""

[environments]
default = { features = [], solve-group = "default" }
