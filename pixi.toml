[workspace]
name = "phono-core-env"
version = "0.1.1"
description = "phono core compile environment"
channels = ["conda-forge"]
platforms = [
    { name = "linux-glibc228", platform = "linux-64", glibc = "2.28" },
    { name = "osx-arm64", platform = "osx-arm64" },
    { name = "win-64", platform = "win-64" }
]

[dependencies]
python = ">=3.13,<3.14"
ninja = "*"
cmake = "*"
pip = "*"

c-compiler = "*"
cxx-compiler = "*"

[pypi-dependencies]
torch = "*"
executorch = "*"

[tasks]
# Fetch the ExecuTorch source and initialize *only* the submodules phono-core
# actually needs for its CMake configuration:
#   - third-party/{flatbuffers,flatcc,json,gflags}: added unconditionally by
#     executorch's third-party/CMakeLists.txt
#   - backends/xnnpack/third-party/{FP16,FXdiv,XNNPACK,cpuinfo,pthreadpool}:
#     required by the XNNPACK backend (EXECUTORCH_BUILD_XNNPACK=ON) and the
#     default cpuinfo/pthreadpool build
# googletest is intentionally excluded: phono-core builds BUILD_TESTING=OFF for
# the ExecuTorch sub-build (it has its own hand-rolled CTest suite).
setup = '''
    test -d third_party/executorch/.git || \
        git clone --depth 1 https://github.com/pytorch/executorch third_party/executorch
    NEEDED=" backends/xnnpack/third-party/FP16 backends/xnnpack/third-party/FXdiv backends/xnnpack/third-party/XNNPACK backends/xnnpack/third-party/cpuinfo backends/xnnpack/third-party/pthreadpool third-party/flatbuffers third-party/flatcc third-party/gflags third-party/json "
    for sub in $(git -C third_party/executorch submodule foreach --quiet 'echo "$name"'); do
        case "$NEEDED" in *" $sub "*) ;; *)
            git -C third_party/executorch submodule deinit -f "$sub" >/dev/null 2>&1 || true ;;
        esac
    done
    git -C third_party/executorch submodule sync
    git -C third_party/executorch submodule update --init --depth 1 \
        backends/xnnpack/third-party/FP16 \
        backends/xnnpack/third-party/FXdiv \
        backends/xnnpack/third-party/XNNPACK \
        backends/xnnpack/third-party/cpuinfo \
        backends/xnnpack/third-party/pthreadpool \
        third-party/flatbuffers \
        third-party/flatcc \
        third-party/gflags \
        third-party/json
'''
format = "black . && isort ."
lint = "flake8 . && mypy ."
config = "cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release $CMAKE_ARGS"
build = "cmake --build build"

[environments]
default = { features = [], solve-group = "default" }