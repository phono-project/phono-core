name: Build and release the core SDK

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          target: linux-64
        - os: ubuntu-24.04-arm
          target: linux-aarch64
        - os: macos-14
          target: macos-arm64
        - os: windows-2022
          target: win-64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.81.0
          # activate-environment: true
          # not compatible with windows
          # prefix-dev/setup-pixi#122
          locked: true
          cache: true
      - uses: actions/cache@v6
        id: third_party_cache
        with:
          path: third_party
          key: ${{ runner.os }}-third_party-${{ hashFiles('justfile') }}
      - name: prepare third_party
        if: steps.third_party_cache.outputs.cache-hit != 'true'
        run: pixi run setup
      - name: configure
        run: pixi run config
      - name: build
        run: pixi run build
      - name: install
        run: pixi run install
      - uses: actions/cache@v6
        id: models_cache
        with:
          path: cache/models
          key: ${{ runner.os }}-models-${{ hashFiles('justfile') }}
      - name: prepare models
        if: steps.models_cache.outputs.cache-hit != 'true'
        run: pixi run prepare-models
      - name: test models
        shell: bash
        run: |
          export PHONO_TEST_MODEL_DIR=cache/models/w4a8/
          pixi run test
          export PHONO_TEST_MODEL_DIR=cache/models/w8a8/
          pixi run test       
      - uses: nttld/setup-ndk@v1
        # only works with linux 64, win 64, mac arm
        if: matrix.target == 'linux-64'
        with:
          ndk-version: r30
          local-cache: true
      - name: build android
        if: matrix.target == 'linux-64'
        env:
          PRESET: android-armv8
        run: |
          pixi run cmake --preset $PRESET
          pixi run cmake --build --preset $PRESET
          pixi run cmake --build --preset $PRESET --target install
      - name: package
        run: |
          pixi run python tools/package_sdk.py
      - uses: actions/upload-artifact@v7
        with:
          name: phono-core-${{ matrix.target }}
          path: artifacts
          if-no-files-found: error

  upload:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - name: ensure release tag
        run: |
          python tools/release_version.py --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
      - uses: actions/download-artifact@v7
        with:
          pattern: phono-core-*
          merge-multiple: true
          path: dist
      - name: Upload verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/phono-core-sdk-*-linux-x86_64.tar.gz dist/phono-core-sdk-*-windows-x64.zip --clobber
